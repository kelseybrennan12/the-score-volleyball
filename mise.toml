[tasks."e2e:_collect:runtime-logs"]
description = "Internal helper to persist isolated e2e runtime logs before teardown"
run = '''
set -eu
state_file="artifacts/e2e/runtime.env"
if [ ! -f "${state_file}" ]; then
  exit 0
fi
set -a
. "${state_file}"
set +a
runtime_logs_dir="artifacts/e2e/runtime-logs"
mkdir -p "${runtime_logs_dir}"
docker compose -f infra/docker/docker-compose.yml -p "${TEST_COMPOSE_PROJECT_NAME}" ps > "${runtime_logs_dir}/compose-ps.txt" 2>&1 || true
docker compose -f infra/docker/docker-compose.yml -p "${TEST_COMPOSE_PROJECT_NAME}" logs --no-color --timestamps e2e-api > "${runtime_logs_dir}/e2e-api.log" 2>&1 || true
docker compose -f infra/docker/docker-compose.yml -p "${TEST_COMPOSE_PROJECT_NAME}" logs --no-color --timestamps e2e-jobs > "${runtime_logs_dir}/e2e-jobs.log" 2>&1 || true
'''

[tasks."e2e:_run:container"]
description = "Internal container Playwright runner against the isolated e2e stack"
usage = '''
arg "[playwright_args]" var=#true help="Optional extra Playwright args"
'''
run = '''
set -eu
if [ -n "${usage_playwright_args:-}" ]; then
  eval "set -- ${usage_playwright_args}"
else
  set --
fi
state_file="artifacts/e2e/runtime.env"
if [ ! -f "${state_file}" ]; then
  echo "Missing ${state_file}. Run 'mise run e2e:stack:up' first." >&2
  exit 1
fi
set -a
. "${state_file}"
set +a
curl --retry 120 --retry-delay 1 --retry-all-errors --fail --silent --output /dev/null "http://localhost:${E2E_WEB_PORT}/healthz" \
  || { echo "Timed out waiting for e2e web on port ${E2E_WEB_PORT}" >&2; exit 1; }
curl --retry 120 --retry-delay 1 --retry-all-errors --fail --silent --output /dev/null "http://localhost:${E2E_IDP_PORT}/_dev/idp/.well-known/openid-configuration" \
  || { echo "Timed out waiting for e2e IDP on port ${E2E_IDP_PORT}" >&2; exit 1; }
curl --retry 120 --retry-delay 1 --retry-all-errors --fail --silent --output /dev/null "http://localhost:${E2E_JOBS_PORT}/healthz" \
  || { echo "Timed out waiting for e2e jobs on port ${E2E_JOBS_PORT}" >&2; exit 1; }
TEST_POSTGRES_PORT= AZURITE_BLOB_PORT= AZURITE_QUEUE_PORT= AZURITE_TABLE_PORT= \
docker compose -f infra/docker/docker-compose.yml -p "${TEST_COMPOSE_PROJECT_NAME}" --profile e2e run --build --rm --no-deps \
  -e DATABASE_URL="postgres://${POSTGRES_USER:-project-starter}:${POSTGRES_PASSWORD:-project-starter}@test-postgres:5432/${TEST_POSTGRES_DB:-project-starter_test}" \
  -e INTEGRATION_TEST_DATABASE_URL="postgres://${POSTGRES_USER:-project-starter}:${POSTGRES_PASSWORD:-project-starter}@test-postgres:5432/${TEST_POSTGRES_DB:-project-starter_test}" \
  -e APP_E2E_SCHEMA_COOKIE_NAME="${APP_E2E_SCHEMA_COOKIE_NAME}" \
  -e TEST_JOBS_GRAPHILE_SCHEMA="${E2E_JOBS_GRAPHILE_SCHEMA:-graphile_worker_e2e}" \
  e2e-playwright pnpm exec playwright test "$@"
'''

[tasks."e2e:smoke:container"]
description = "Execute Playwright smoke flows inside the Playwright runner container against the isolated e2e stack"
usage = '''
arg "[playwright_args]" var=#true help="Optional extra Playwright args"
'''
run = '''
set -eu
cleanup() {
  mise run e2e:_collect:runtime-logs >/dev/null 2>&1 || true
  mise run e2e:stack:down >/dev/null 2>&1 || true
}
trap cleanup EXIT
mise run e2e:stack:up
if [ -n "${usage_playwright_args:-}" ]; then
  mise run e2e:_run:container -- ${usage_playwright_args}
else
  mise run e2e:_run:container
fi
'''

[tasks."dev:db:generate"]
description = "Generate a new Drizzle migration file from schema changes"
depends = ["deps:install"]
tools = { node = "latest" }
usage = 'arg "name" help="Descriptive slug for the migration (e.g. add-user-email-column)"'
run = '''
node ./node_modules/drizzle-kit/bin.cjs generate --config drizzle.config.ts --name "$usage_name"
'''

[tasks."dev:db:sql"]
description = "Run SQL against local postgres via docker-compose"
usage = '''
arg "<sql>" help="SQL statement to execute (quote the argument)"
'''
run = """
docker compose -f infra/docker/docker-compose.yml up -d postgres
docker compose -f infra/docker/docker-compose.yml exec -T postgres \
  psql -U "${POSTGRES_USER:-project-starter}" \
  -d "${POSTGRES_DB:-project-starter}" \
  -v ON_ERROR_STOP=1 \
  -c "${usage_sql?}"
"""

[tasks."dev:db:bootstrap"]
description = "Run the local database bootstrap service"
run = """
docker compose -f infra/docker/docker-compose.yml --profile dev up --build dev-bootstrap
"""

[tasks."dev:env-sync"]
description = "Sync .env keys and ordering from .env.example"
run = "node scripts/dev/env-sync.mjs"

[tasks.hooks-install]
description = "Install git pre-commit hook"
run = "mise generate git-pre-commit --write --task=pre-commit"
