[settings]
windows_default_inline_shell_args = "bash -c"

[tools]
node = "latest"
pnpm = "latest"
gh = "latest"

[tasks."deps:install"]
description = "Install repository Node dependencies from the lockfile"
tools = { node = "latest", pnpm = "latest" }
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the Next.js dev server"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run dev"

[tasks.build]
description = "Build the Next.js production bundle"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run build"

[tasks.ingest]
description = "Fetch league spreadsheets and refresh data/snapshots/"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
usage = '''
arg "[ingest_args]" var=#true help="Optional args forwarded to the ingest CLI (e.g. --league spring-sundays, --dry-run)"
'''
run = '''
if [ -n "${usage_ingest_args:-}" ]; then
  eval "set -- ${usage_ingest_args}"
else
  set --
fi
pnpm run ingest -- "$@"
'''

[tasks.fmt]
description = "Format repository files"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run fmt"

[tasks.fmt-check]
description = "Check repository formatting (staged files only during pre-commit)"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = '''
if [ -n "$MISE_PRE_COMMIT" ]; then
  if ! git diff --cached --quiet --name-only --diff-filter=d; then
    git diff --cached --name-only --diff-filter=d -z | xargs -0 pnpm exec prettier --check --ignore-unknown
  fi
else
  pnpm run fmt-check
fi
'''

[tasks.lint]
description = "Lint repository source"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run lint"

[tasks.typecheck]
description = "Typecheck repository source"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run typecheck"

[tasks.test]
description = "Run unit and integration tests"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run test"

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests"
depends = ["deps:install"]
tools = { node = "latest", pnpm = "latest" }
run = "pnpm run test:e2e"

[tasks."gh:auth"]
description = "Show GitHub CLI authentication status"
tools = { gh = "latest" }
run = "gh auth status"

[tasks.hooks-install]
description = "Install git pre-commit hook"
run = "mise generate git-pre-commit --write --task=pre-commit"
