name: CI
run-name: >-
  ${{
    github.event_name == 'push'
    && format('CI: {0}', github.event.head_commit.message)
    || github.event_name == 'pull_request'
    && format('CI: PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('CI: manual run on {0}', github.ref_name)
  }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; let every push to main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the [tools] pinned in mise.toml (node, pnpm, gh) and puts them on PATH.
      - uses: jdx/mise-action@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: mise run deps:install

      - run: mise run fmt-check

      - run: mise run lint

      - run: mise run typecheck

      - run: mise run test

      - run: mise run build
