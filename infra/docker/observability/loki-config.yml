auth_enabled: false

server:
  http_listen_port: 3100
  # Grafana Explore detected-fields requests can exceed Loki's default 4 MiB gRPC frame
  # when high-cardinality structured metadata is present in a short range.
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  # Local/dev only: permit startup/replay without dropping batches for old log timestamps.
  reject_old_samples: false
  allow_structured_metadata: true
  volume_enabled: true

pattern_ingester:
  enabled: true
