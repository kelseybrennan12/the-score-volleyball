name: project-starter

x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
  OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS}
  OTEL_EXPORTER_OTLP_TIMEOUT_MS: ${OTEL_EXPORTER_OTLP_TIMEOUT_MS}

x-auth-env: &auth-env
  AUTH_PROVIDER: ${AUTH_PROVIDER:-dev}
  AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-project-starter-web}
  AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-project-starter-api}
  AUTH_SCOPE: ${AUTH_SCOPE:-openid profile email offline_access}
  AUTH_TENANT_ID: ${AUTH_TENANT_ID:-dev-tenant}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_SESSION_IDLE_TIMEOUT_MS: ${AUTH_SESSION_IDLE_TIMEOUT_MS:-28800000}
  AUTH_SESSION_MAX_LIFETIME_MS: ${AUTH_SESSION_MAX_LIFETIME_MS:-43200000}
  AUTH_STATE_TTL_MS: ${AUTH_STATE_TTL_MS:-600000}
  AUTH_SESSION_ENCRYPTION_KEY: ${AUTH_SESSION_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  AUTH_ADMIN_GROUP_ID: ${AUTH_ADMIN_GROUP_ID:-dev-admin-group}
  AUTH_USER_GROUP_ID: ${AUTH_USER_GROUP_ID:-dev-user-group}

x-storage-env: &storage-env
  AZURE_STORAGE_ACCOUNT_NAME: devstoreaccount1
  AZURE_CLIENT_ID: ""
  AZURE_USER_UPLOADS_CONTAINER_NAME: user-uploads

services:
  postgres:
    image: postgres:16-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-project-starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project-starter}
      POSTGRES_DB: ${POSTGRES_DB:-project-starter}
    ports:
      - "${POSTGRES_PORT-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project-starter} -d ${POSTGRES_DB:-project-starter}"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-postgres:
    profiles: ["test", "e2e"]
    image: postgres:16-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-project-starter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project-starter}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-project-starter_test}
    ports:
      - "${TEST_POSTGRES_PORT-5434}:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-project-starter} -d ${TEST_POSTGRES_DB:-project-starter_test}"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-bootstrap:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    command: ["pnpm", "run", "app:bootstrap"]
    restart: "no"
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      APP_DB_SCHEMA: ${APP_DB_SCHEMA:-${TEST_BASE_APP_DB_SCHEMA:-public}}
      APP_STARTUP_SEED_PACK: ${APP_STARTUP_SEED_PACK:-none}
      JOBS_GRAPHILE_SCHEMA: ${JOBS_GRAPHILE_SCHEMA:-${TEST_JOBS_GRAPHILE_SCHEMA:-graphile_worker_test}}
      APP_IMAGE_TAG: local-test
      OTEL_SERVICE_NAME: project-starter-test-db-bootstrap
      <<: *telemetry-env
    depends_on:
      test-postgres:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command:
      [
        "azurite",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
        "--location",
        "/data",
        "--skipApiVersionCheck",
      ]
    ports:
      - "${AZURITE_BLOB_PORT-10000}:10000"
      - "${AZURITE_QUEUE_PORT-10001}:10001"
      - "${AZURITE_TABLE_PORT-10002}:10002"
    volumes:
      - azurite_data:/data

  dev-bootstrap:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    command: ["pnpm", "run", "app:bootstrap"]
    restart: "no"
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${DEV_APP_DB_SCHEMA:-app_dev}
      APP_STARTUP_SEED_PACK: ${DEV_APP_STARTUP_SEED_PACK:-baseline}
      JOBS_GRAPHILE_SCHEMA: ${DEV_JOBS_GRAPHILE_SCHEMA:-graphile_worker_dev}
      APP_IMAGE_TAG: local-dev
      OTEL_SERVICE_NAME: project-starter-dev-db-bootstrap
      <<: *telemetry-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: dev-backend
    restart: unless-stopped
    command: ["pnpm", "run", "dev:api"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${DEV_APP_DB_SCHEMA:-app_dev}
      API_PORT: "3000"
      JOBS_GRAPHILE_SCHEMA: ${DEV_JOBS_GRAPHILE_SCHEMA:-graphile_worker_dev}
      FRONTEND_ORIGIN: http://localhost:${API_PORT:-3000}
      AUTH_ISSUER: http://localhost:${IDP_PORT:-3003}/_dev/idp
      AUTH_OIDC_METADATA_URL: http://idp:3000/_dev/idp/.well-known/openid-configuration/internal
      AUTH_DEV_BROWSER_ISSUER_NON_LOOPBACK: http://idp:3000/_dev/idp
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-project-starter-session}
      OTEL_SERVICE_NAME: project-starter-api
      CHOKIDAR_USEPOLLING: "true"
      <<: [*auth-env, *telemetry-env]
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
      idp:
        condition: service_started
    volumes:
      - ../../src:/app/src

  frontend:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: dev-frontend
    restart: unless-stopped
    command: ["pnpm", "run", "dev:frontend"]
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: /api
      VITE_ENABLE_ADMIN_TAB: ${VITE_ENABLE_ADMIN_TAB:-false}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ../../src:/app/src

  dev-edge:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: dev-edge
    restart: unless-stopped
    environment:
      EDGE_PORT: "${API_PORT:-3000}"
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"

  idp:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: dev-backend
    restart: unless-stopped
    command: ["pnpm", "run", "dev:idp"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${DEV_APP_DB_SCHEMA:-app_dev}
      IDP_PORT: "3000"
      IDP_ISSUER: http://localhost:${IDP_PORT:-3003}/_dev/idp
      OTEL_SERVICE_NAME: project-starter-idp
      <<: [*telemetry-env, *auth-env]
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${IDP_PORT:-3003}:3000"
    volumes:
      - ../../src:/app/src

  jobs:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: dev-backend
    restart: unless-stopped
    command: ["pnpm", "run", "dev:worker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${DEV_APP_DB_SCHEMA:-app_dev}
      JOBS_PORT: "3001"
      JOBS_POLL_INTERVAL_MS: ${JOBS_POLL_INTERVAL_MS}
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY}
      JOBS_GRAPHILE_SCHEMA: ${DEV_JOBS_GRAPHILE_SCHEMA:-graphile_worker_dev}
      OTEL_SERVICE_NAME: project-starter-jobs
      CHOKIDAR_USEPOLLING: "true"
      <<: *telemetry-env
    depends_on:
      dev-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../../src:/app/src

  app-bootstrap:
    profiles: ["built"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    command: ["pnpm", "run", "app:bootstrap"]
    restart: "no"
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${BUILT_APP_DB_SCHEMA:-app_built}
      APP_STARTUP_SEED_PACK: ${BUILT_APP_STARTUP_SEED_PACK:-baseline}
      JOBS_GRAPHILE_SCHEMA: ${BUILT_JOBS_GRAPHILE_SCHEMA:-graphile_worker_built}
      APP_IMAGE_TAG: local-built
      OTEL_SERVICE_NAME: project-starter-built-db-bootstrap
      <<: *telemetry-env
    depends_on:
      postgres:
        condition: service_healthy

  app-api:
    profiles: ["built"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    restart: unless-stopped
    command: ["pnpm", "run", "app:api"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${BUILT_APP_DB_SCHEMA:-app_built}
      API_PORT: "3000"
      JOBS_GRAPHILE_SCHEMA: ${BUILT_JOBS_GRAPHILE_SCHEMA:-graphile_worker_built}
      FRONTEND_ORIGIN: http://localhost:${BUILT_WEB_PORT:-3102}
      AUTH_ISSUER: http://localhost:${BUILT_IDP_PORT:-3103}/_dev/idp
      AUTH_OIDC_METADATA_URL: http://app-idp:3000/_dev/idp/.well-known/openid-configuration/internal
      AUTH_DEV_BROWSER_ISSUER_NON_LOOPBACK: http://app-idp:3000/_dev/idp
      AUTH_SESSION_COOKIE_NAME: ${BUILT_AUTH_SESSION_COOKIE_NAME:-project-starter-session-built}
      OTEL_SERVICE_NAME: project-starter-app-api
      <<: [*telemetry-env, *storage-env, *auth-env]
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
      app-idp:
        condition: service_started

  app-idp:
    profiles: ["built"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    restart: unless-stopped
    command: ["pnpm", "run", "app:idp"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${BUILT_APP_DB_SCHEMA:-app_built}
      IDP_PORT: "3000"
      IDP_ISSUER: http://localhost:${BUILT_IDP_PORT:-3103}/_dev/idp
      OTEL_SERVICE_NAME: project-starter-app-idp
      <<: [*telemetry-env, *auth-env]
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${BUILT_IDP_PORT:-3103}:3000"

  app-jobs:
    profiles: ["built"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    restart: unless-stopped
    command: ["pnpm", "run", "app:worker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      APP_DB_SCHEMA: ${BUILT_APP_DB_SCHEMA:-app_built}
      JOBS_PORT: "3001"
      JOBS_POLL_INTERVAL_MS: ${JOBS_POLL_INTERVAL_MS}
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY}
      JOBS_GRAPHILE_SCHEMA: ${BUILT_JOBS_GRAPHILE_SCHEMA:-graphile_worker_built}
      OTEL_SERVICE_NAME: project-starter-app-jobs
      <<: *telemetry-env
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully

  app-edge:
    profiles: ["built"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-edge
    restart: unless-stopped
    environment:
      EDGE_PORT: "8080"
      API_UPSTREAM: http://app-api:3000
    depends_on:
      app-api:
        condition: service_started
    ports:
      - "${BUILT_WEB_PORT:-3102}:8080"

  e2e-bootstrap:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    command: ["pnpm", "run", "app:bootstrap"]
    restart: "no"
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      APP_DB_SCHEMA: ${E2E_BASE_APP_DB_SCHEMA:-public}
      APP_STARTUP_SEED_PACK: ${E2E_APP_STARTUP_SEED_PACK:-none}
      JOBS_GRAPHILE_SCHEMA: ${E2E_JOBS_GRAPHILE_SCHEMA:-graphile_worker_e2e}
      APP_IMAGE_TAG: local-e2e
      OTEL_SERVICE_NAME: project-starter-e2e-db-bootstrap
      <<: *telemetry-env
    depends_on:
      test-postgres:
        condition: service_healthy

  e2e-api:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    restart: "no"
    command: ["pnpm", "run", "app:api"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      APP_DB_SCHEMA: ${E2E_BASE_APP_DB_SCHEMA:-public}
      APP_E2E_SCHEMA_OVERRIDE_ENABLED: "true"
      APP_E2E_SCHEMA_COOKIE_NAME: ${APP_E2E_SCHEMA_COOKIE_NAME:-project-starter-e2e-schema}
      API_PORT: "3000"
      JOBS_GRAPHILE_SCHEMA: ${E2E_JOBS_GRAPHILE_SCHEMA:-graphile_worker_e2e}
      FRONTEND_ORIGIN: http://localhost:${E2E_WEB_PORT:-3202}
      AUTH_ISSUER: http://localhost:${E2E_IDP_PORT:-3203}/_dev/idp
      AUTH_OIDC_METADATA_URL: http://e2e-idp:3000/_dev/idp/.well-known/openid-configuration/internal
      AUTH_DEV_BROWSER_ISSUER_NON_LOOPBACK: http://e2e-idp:3000/_dev/idp
      AUTH_SESSION_COOKIE_NAME: ${E2E_AUTH_SESSION_COOKIE_NAME:-project-starter-session-e2e}
      OTEL_SERVICE_NAME: project-starter-e2e-api
      <<: [*telemetry-env, *storage-env, *auth-env]
    depends_on:
      e2e-bootstrap:
        condition: service_completed_successfully
      e2e-idp:
        condition: service_started

  e2e-idp:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    restart: "no"
    command: ["pnpm", "run", "app:idp"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      APP_DB_SCHEMA: ${E2E_BASE_APP_DB_SCHEMA:-public}
      APP_E2E_SCHEMA_OVERRIDE_ENABLED: "true"
      APP_E2E_SCHEMA_COOKIE_NAME: ${APP_E2E_SCHEMA_COOKIE_NAME:-project-starter-e2e-schema}
      IDP_PORT: "3000"
      IDP_ISSUER: http://localhost:${E2E_IDP_PORT:-3203}/_dev/idp
      OTEL_SERVICE_NAME: project-starter-e2e-idp
      <<: [*telemetry-env, *auth-env]
    depends_on:
      e2e-bootstrap:
        condition: service_completed_successfully
    ports:
      - "${E2E_IDP_PORT:-3203}:3000"

  e2e-jobs:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-base
    restart: "no"
    command: ["pnpm", "run", "app:worker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      APP_DB_SCHEMA: ${E2E_BASE_APP_DB_SCHEMA:-public}
      APP_E2E_SCHEMA_OVERRIDE_ENABLED: "true"
      APP_E2E_SCHEMA_COOKIE_NAME: ${APP_E2E_SCHEMA_COOKIE_NAME:-project-starter-e2e-schema}
      JOBS_PORT: "3001"
      JOBS_POLL_INTERVAL_MS: ${E2E_JOBS_POLL_INTERVAL_MS}
      JOBS_CONCURRENCY: ${E2E_JOBS_CONCURRENCY}
      JOBS_GRAPHILE_SCHEMA: ${E2E_JOBS_GRAPHILE_SCHEMA:-graphile_worker_e2e}
      OTEL_SERVICE_NAME: project-starter-e2e-jobs
      <<: *telemetry-env
    depends_on:
      e2e-bootstrap:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    ports:
      - "${E2E_JOBS_PORT:-3204}:3001"

  e2e-edge:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: app-edge
    restart: "no"
    environment:
      EDGE_PORT: "8080"
      API_UPSTREAM: http://e2e-api:3000
    depends_on:
      e2e-api:
        condition: service_started
    ports:
      - "${E2E_WEB_PORT:-3202}:8080"

  e2e-playwright:
    profiles: ["e2e"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: playwright-runner
    working_dir: /app
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      INTEGRATION_TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://project-starter:project-starter@test-postgres:5432/project-starter_test}
      PLAYWRIGHT_BASE_URL: http://e2e-edge:8080
      PLAYWRIGHT_IDP_BASE_URL: http://e2e-idp:3000
      APP_E2E_SCHEMA_COOKIE_NAME: ${APP_E2E_SCHEMA_COOKIE_NAME:-project-starter-e2e-schema}
      PLAYWRIGHT_ARTIFACTS_DIR: /app/artifacts/e2e
      CI: ${CI:-}
    volumes:
      - ../../artifacts/e2e:/app/artifacts/e2e
    depends_on:
      e2e-edge:
        condition: service_started
      e2e-idp:
        condition: service_started
    command: ["pnpm", "run", "test:e2e"]

  loki:
    profiles: ["dev"]
    image: grafana/loki:3.2.1
    stop_grace_period: 1s
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro

  tempo:
    profiles: ["dev"]
    image: grafana/tempo:2.8.2
    stop_grace_period: 1s
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
    volumes:
      - tempo_data:/var/tempo
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro

  alloy:
    profiles: ["dev"]
    image: grafana/alloy:v1.12.0
    stop_grace_period: 1s
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./observability/alloy.river:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    profiles: ["dev"]
    image: prom/prometheus:v2.53.2
    stop_grace_period: 1s
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--web.enable-remote-write-receiver",
      ]
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      alloy:
        condition: service_started

  grafana:
    profiles: ["dev"]
    image: grafana/grafana:11.6.0
    stop_grace_period: 1s
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_INSTALL_PLUGINS: https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app
      GF_PLUGINS_DISABLE_PLUGINS: grafana-pyroscope-app,grafana-metricsdrilldown-app
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  postgres_data:
  test_postgres_data:
  grafana_data:
  loki_data:
  prometheus_data:
  tempo_data:
  azurite_data:
