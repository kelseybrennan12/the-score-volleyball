[mcp_servers.starter_mise]
command = "mise"
args = ["mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 1800

[mcp_servers.starter_mise.env]
MISE_EXPERIMENTAL = "1"

[mcp_servers.happy_cow_mise.tools.run_task]
approval_mode = "approve"

[mcp_servers.happy_cow_mise.tools.install_tool]
approval_mode = "approve"
